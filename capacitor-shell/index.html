<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lá da Vendinha</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0f172a;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
        padding: 24px;
      }
      .logo {
        font-size: 48px;
        font-weight: 900;
      }
      .logo span {
        color: #ea580c;
      }
      p {
        opacity: 0.8;
        max-width: 320px;
      }
      button {
        background: #ea580c;
        color: #fff;
        border: 0;
        border-radius: 14px;
        padding: 14px 22px;
        font-size: 16px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">Lá da <span>Vendinha</span></div>
      <p>Sem conexão no momento. Conecte-se à internet e tente novamente para ver os negócios da sua região.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
